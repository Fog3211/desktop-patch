name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点 (UTC时间)
  workflow_dispatch:      # 允许手动触发

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 获取完整历史记录

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/desktop/desktop.git || true
          git fetch upstream

      - name: Switch to development branch
        run: |
          echo "Current branch: $(git branch --show-current)"
          git checkout development || git checkout -b development

      - name: Check for upstream updates
        id: check
        run: |
          # 获取上游最新提交
          UPSTREAM_HEAD=$(git rev-parse upstream/development)
          LOCAL_HEAD=$(git rev-parse HEAD)
          
          echo "upstream_head=$UPSTREAM_HEAD" >> $GITHUB_OUTPUT
          echo "local_head=$LOCAL_HEAD" >> $GITHUB_OUTPUT
          
          if [ "$UPSTREAM_HEAD" = "$LOCAL_HEAD" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "✅ develop 分支已是最新"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            # 计算提交差异
            COMMITS_BEHIND=$(git rev-list --count HEAD..upstream/development)
            echo "commits_behind=$COMMITS_BEHIND" >> $GITHUB_OUTPUT
            echo "🔄 发现 $COMMITS_BEHIND 个新提交需要同步"
          fi

      - name: Sync with upstream
        if: steps.check.outputs.has_updates == 'true'
        run: |
          echo "🔄 正在同步上游更改..."
          
          # 强制更新到上游最新状态（保持 develop 分支纯净）
          git reset --hard upstream/development
          
          echo "✅ 同步完成！"
          echo "📊 最新提交："
          git log --oneline -5

      - name: Push changes
        if: steps.check.outputs.has_updates == 'true'
        run: |
          echo "📤 推送更改到远程仓库..."
          git push origin development --force-with-lease
          echo "✅ 推送完成！"

      - name: Create sync summary
        if: always()
        run: |
          echo "## 🔄 上游同步摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
                     if [ "${{ steps.check.outputs.has_updates }}" = "true" ]; then
             echo "### ✅ 同步成功" >> $GITHUB_STEP_SUMMARY
             echo "- 📦 同步了 ${{ steps.check.outputs.commits_behind }} 个新提交" >> $GITHUB_STEP_SUMMARY
             echo "- 🎯 development 分支已更新到最新状态" >> $GITHUB_STEP_SUMMARY
             echo "- 🔗 可以开始将你的功能分支变基到最新的 development" >> $GITHUB_STEP_SUMMARY
           else
             echo "### ℹ️ 无需同步" >> $GITHUB_STEP_SUMMARY
             echo "- ✅ development 分支已是最新状态" >> $GITHUB_STEP_SUMMARY
             echo "- 📅 下次检查: 明天凌晨 2 点" >> $GITHUB_STEP_SUMMARY
           fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 下一步操作" >> $GITHUB_STEP_SUMMARY
                     echo "如果你的功能分支需要更新，请运行：" >> $GITHUB_STEP_SUMMARY
           echo '```bash' >> $GITHUB_STEP_SUMMARY
           echo 'git checkout feature/your-feature' >> $GITHUB_STEP_SUMMARY
           echo 'git rebase development' >> $GITHUB_STEP_SUMMARY
           echo '```' >> $GITHUB_STEP_SUMMARY 
