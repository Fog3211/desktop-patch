name: Build and Release

on:
  workflow_dispatch:  # 手动触发
    inputs:
      feature_branch:
        description: '要合并的功能分支名称'
        required: true
        default: 'feature/my-changes'
        type: string
      release_version:
        description: '发布版本号 (如 v1.0.0-custom.1)'
        required: true
        default: 'v1.0.0-custom.1'
        type: string

jobs:
  merge-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create/Update release branch
        run: |
          echo "🔄 准备 release 分支..."
          
          # 获取最新的 development 分支
          git fetch origin development
          git checkout development
          git pull origin development
          
          # 创建或切换到 release 分支
          git checkout release || git checkout -b release development
          
          # 重置 release 分支到最新的 development
          git reset --hard development
          
          echo "✅ release 分支已重置到最新的 development"

      - name: Merge feature branch
        id: merge
        run: |
          echo "🔀 合并功能分支: ${{ github.event.inputs.feature_branch }}"
          
          # 获取功能分支
          git fetch origin ${{ github.event.inputs.feature_branch }}
          
          # 尝试合并功能分支
          if git merge origin/${{ github.event.inputs.feature_branch }} --no-edit; then
            echo "✅ 功能分支合并完成"
            echo "merge_status=success" >> $GITHUB_OUTPUT
            
            # 显示合并后的状态
            echo "📊 合并后的提交历史："
            git log --oneline -10
          else
            echo "❌ 合并冲突检测到！"
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            
            # 获取冲突文件列表
            echo "🔍 冲突文件："
            git status --porcelain | grep "^UU\|^AA\|^DD" > conflicts.txt || echo "无法确定冲突文件" > conflicts.txt
            cat conflicts.txt
            
            # 中止合并，保持干净状态
            git merge --abort
            
            # 输出冲突信息供后续步骤使用
            echo "conflict_files<<EOF" >> $GITHUB_OUTPUT
            cat conflicts.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create conflict issue
        if: steps.merge.outputs.merge_status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const conflictFiles = `${{ steps.merge.outputs.conflict_files }}`;
            
            const title = `🚨 Release 构建失败 - 合并冲突 (${new Date().toISOString().split('T')[0]})`;
            const body = `
            ## 🚨 自动构建发布时发生合并冲突
            
            **时间**: ${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}
            **功能分支**: \`${{ github.event.inputs.feature_branch }}\`
            **目标版本**: \`${{ github.event.inputs.release_version }}\`
            **工作流运行**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### 冲突详情
            \`\`\`
            ${conflictFiles}
            \`\`\`
            
            ### 解决步骤
            
            1. **本地解决冲突**:
               \`\`\`bash
               # 克隆仓库（如果还没有）
               git clone ${{ github.server_url }}/${{ github.repository }}.git
               cd desktop
               
               # 切换到 development 分支并更新
               git checkout development
               git pull origin development
               
               # 创建临时分支解决冲突
               git checkout -b resolve-conflict-${{ github.run_number }}
               
               # 尝试合并功能分支
               git merge origin/${{ github.event.inputs.feature_branch }}
               
               # 手动解决冲突文件，然后：
               git add .
               git commit -m "resolve: merge conflicts between development and ${{ github.event.inputs.feature_branch }}"
               
               # 推送解决方案
               git push origin resolve-conflict-${{ github.run_number }}
               \`\`\`
            
            2. **创建 Pull Request**:
               - 从 \`resolve-conflict-${{ github.run_number }}\` 到 \`${{ github.event.inputs.feature_branch }}\`
               - 或者直接更新你的功能分支：
                 \`\`\`bash
                 git checkout ${{ github.event.inputs.feature_branch }}
                 git rebase development
                 # 解决冲突后
                 git push origin ${{ github.event.inputs.feature_branch }} --force-with-lease
                 \`\`\`
            
            3. **重新触发构建**:
               - 冲突解决后，在 Actions 页面重新运行 "Build and Release" 工作流
            
            ### 预防措施
            建议定期将你的功能分支变基到最新的 development：
            \`\`\`bash
            git checkout ${{ github.event.inputs.feature_branch }}
            git fetch origin development
            git rebase development
            git push origin ${{ github.event.inputs.feature_branch }} --force-with-lease
            \`\`\`
            
            ---
            _此 Issue 由构建失败自动创建_
            `;
            
            // 检查是否已存在相同的未关闭 issue（今天的）
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-conflict'
            });
            
            const todayStr = new Date().toISOString().split('T')[0];
            const existingToday = existingIssues.find(issue => 
              issue.title.includes(todayStr)
            );
            
            if (!existingToday) {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['build-conflict', 'help wanted', 'merge-conflict']
              });
              
              console.log(`Created conflict issue: ${issue.html_url}`);
            } else {
              console.log(`Issue for today already exists: ${existingToday.html_url}`);
            }

      - name: Stop workflow on conflict
        if: steps.merge.outputs.merge_status == 'conflict'
        run: |
          echo "❌ 由于合并冲突，构建流程已停止"
          echo "🔗 请查看自动创建的 Issue 获取解决指南"
          exit 1

      - name: Update version in package.json
        if: steps.merge.outputs.merge_status == 'success'
        run: |
          echo "📝 更新版本号到: ${{ github.event.inputs.release_version }}"
          
          # 使用 Node.js 更新版本号
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ github.event.inputs.release_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('Version updated to:', pkg.version);
          "

      - name: Install dependencies
        if: steps.merge.outputs.merge_status == 'success'
        run: |
          echo "📦 安装依赖..."
          npm ci

      - name: Build application
        if: steps.merge.outputs.merge_status == 'success'
        env:
          # 个人使用，无需签名证书
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          echo "🏗️ 构建 ${{ matrix.platform }} 平台应用..."
          
          # 根据平台构建
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            npm run build:mac
          elif [ "${{ matrix.platform }}" = "win32" ]; then
            npm run build:win
          else
            npm run build:linux
          fi

      - name: Upload build artifacts
        if: steps.merge.outputs.merge_status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-patch-${{ matrix.platform }}-${{ github.event.inputs.release_version }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.zip
            dist/*.tar.gz
          retention-days: 30

      - name: Update release branch
        if: steps.merge.outputs.merge_status == 'success' && matrix.platform == 'darwin'
        run: |
          echo "📤 推送 release 分支到远程..."
          git push origin release --force-with-lease

  create-release:
    needs: merge-and-build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_version }}
          name: 'GitHub Desktop Custom ${{ github.event.inputs.release_version }}'
          body: |
            ## 🎉 GitHub Desktop 个人定制版

            **基于**: GitHub Desktop 官方最新版
            **功能分支**: `${{ github.event.inputs.feature_branch }}`
            **构建时间**: ${{ github.run_number }}

            ### 📥 下载

            选择适合你操作系统的版本：
            
            - **macOS**: `.dmg` 文件
            - **Windows**: `.exe` 文件  
            - **Linux**: `.AppImage` 文件

            ### 🔄 自动更新

            应用内置自动更新功能，后续版本会自动推送更新通知。

            ### ⚠️ 注意事项

            - **macOS 用户**: 首次打开需要右键点击选择"打开"并确认
            - **Windows 用户**: 可能会有 SmartScreen 警告，点击"更多信息"→"仍要运行"
            - **个人使用**: 此版本仅供个人使用，未经官方签名

            ---
            *自动构建于 GitHub Actions*
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true

 
